<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <style>
    .logo-text { font-family: Arial, sans-serif; font-weight: bold; }
    .main-title { font-size: 22px; }
    .sub-title { font-size: 14px; }
  </style>
  <!-- Main logo shape - stylized building/document -->
  <g fill="#2c3e50">
    <path d="M30,10 L50,10 L50,50 L10,50 L10,20 L30,10 Z" fill="#4e73df" />
    <path d="M30,10 L30,20 L10,20" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <rect x="20" y="30" width="20" height="4" fill="#ffffff" />
    <rect x="20" y="38" width="20" height="4" fill="#ffffff" />
  </g>
  
  <!-- Organization name -->
  <text x="60" y="25" class="logo-text main-title" fill="#2c3e50">Maharashtra</text>
  <text x="60" y="40" class="logo-text main-title" fill="#4e73df">Lokadhikar Samiti</text>
  
  <!-- Subtitle -->
  <text x="60" y="55" class="logo-text sub-title" fill="#5a5c69">Borrower Management System</text>
</svg>